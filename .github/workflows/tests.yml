name: CareerPilot tests
on:
  pull_request:
  push:
    branches:
      - main
      - feature/manual-payment-review
      - feature/social-jobs-radar
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check server.js && node --check radar.js && if [ -f jobs-radar.js ]; then node --check jobs-radar.js; fi
      - name: Run available test suites
        run: |
          if [ -f jobs-radar.test.js ]; then
            node --test radar.test.js jobs-radar.test.js
          else
            node --test radar.test.js
          fi
