name: CareerPilot tests
on:
  pull_request:
  push:
    branches:
      - main
      - feature/social-jobs-radar
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check server.js && node --check radar.js && node --check jobs-radar.js
      - name: Run test suites
        run: node --test radar.test.js jobs-radar.test.js
